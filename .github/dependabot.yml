# Dependency updates (SCA half of the security baseline in AGENTS.md).
#
# Note the gotcha that file records: a top-level bump does not always reach a
# nested copy a tool bundles internally. After any security bump, confirm with
# `npm ls <pkg>` and add a package.json `overrides` entry if a vulnerable
# nested copy survives.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Everything here is a devDependency, so a routine bump is a chore, not a
    # release. One grouped PR per week keeps CI cheap and the log readable;
    # security fixes still arrive on their own, ungrouped and immediately.
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # One PR for the whole set, majors included.
    #
    # Ungrouped, the first run opened three separate pull requests that each
    # edited the same handful of lines in ci.yml, and each one invalidated the
    # other two the moment it merged. Action bumps also arrive in lockstep -
    # the three that landed on 2026-08-26 were all the same change underneath,
    # the runtime moving to Node 24 - so reviewing them apart costs three CI
    # runs to answer one question.
    #
    # Majors are grouped here but NOT in the npm block above, because these are
    # first-party GitHub actions pinned by major tag: the blast radius of a bad
    # one is a red CI run, visible immediately and reverted with one commit.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [major, minor, patch]
    commit-message:
      prefix: "chore(ci)"
