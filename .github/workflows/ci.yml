# The gate for every change. AGENTS.md names four commands that must pass
# before a change is called done; this file is those four commands, run on a
# machine that is not the author's.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: the older run's answer is about code
# nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Since Phase 1 this is about style and accessibility, not existence -
      # `tsc` in the next job is what catches a name that does not exist. The
      # part that cannot move there is `jsx-a11y` at full `recommended`, which
      # AGENTS.md calls a blocking check.
      - name: ESLint
        run: npm run lint

      - name: markdownlint
        run: npm run lint:md

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `next build` type-checks too, but only after compiling, so a type
      # error costs a full build before it is reported. This answers the same
      # question in seconds and names itself in the checks list.
      - name: tsc --noEmit
        run: npm run typecheck

  build:
    name: Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The Phase 0 gate is "CI green on an empty page". This job is that gate:
      # it proves the scaffold compiles, that `basePath` is applied, and that
      # every route still prerenders as static.
      - name: Build
        run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No fake timers anywhere in here: the engine takes the current time as
      # an argument, so the suite is pure arithmetic and needs no clock.
      - name: Vitest
        run: npm test

  e2e:
    # THE NAME IS LOAD-BEARING. Branch protection on `main` requires this check
    # by its exact string, so renaming it here silently removes the gate: the
    # required "E2E (reflow gate)" would never report again and every PR would
    # wait forever for a job that no longer exists under that name. It now runs
    # rather more than the reflow gate - see the step comments below - and the
    # name stays until the protection rule is updated in the same change.
    name: E2E (reflow gate)
    # (Discovered on `test/three-engines`, where renaming this to match what it
    # does would have removed the gate silently rather than failing loudly.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `channel: "chrome"` in playwright.config.ts means real Google Chrome,
      # not the bundled Chromium, so the runner has to install it by name.
      # WebKit and Firefox are Playwright's own builds and come from the same
      # command; `--with-deps` is what pulls the system libraries WebKit needs
      # on a bare Ubuntu runner, and without it the browser installs and then
      # fails to launch.
      - name: Install browsers
        run: npx playwright install --with-deps chrome webkit firefox

      # Three things AGENTS.md calls blocking, in one job.
      #
      # The WCAG 2.2 SC 1.4.10 reflow check at 320/375/768/1024/1440; the axe
      # scan, which the accessibility research asks for on every journey with
      # zero critical or serious violations to release; and all of it across
      # Chrome, WebKit and Firefox, because "real WebKit coverage" is the reason
      # this repo chose Playwright over Cypress in the first place.
      #
      # No separate build step: Playwright's `webServer` runs `npm run build &&
      # next start` itself, so the suite measures the CSS that actually ships
      # rather than a dev server's unchunked version of it.
      - name: Playwright
        run: npm run e2e

      # Both paths, because they hold different things: the html report is the
      # readable summary, and test-results/ is where trace.zip lands for
      # `npx playwright show-trace`. A red run that hands back neither costs a
      # full debugging round trip.
      - name: Upload report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Every dependency in this repo is a devDependency - nothing here reaches
      # a user's browser. The gate is set at `high` so a moderate advisory in a
      # test tool does not block a schedule bugfix, while something genuinely
      # bad still does.
      - name: Audit
        run: npm audit --audit-level=high
