# TEMPORARY, and deleted once this branch's fix is verified.
#
# `ci.yml` runs Chrome alone on a pull request and all three engines only on a
# push to `main` - which is exactly how a WebKit-only failure reached `main` and
# stayed there for sixteen nightly runs. A fix for that failure that is itself
# verified on Chrome alone would be the same bet, lost the same way, so this
# runs the full suite on all three engines against the branch BEFORE it merges.
name: WebKit date probe

on:
  push:
    branches: [claude/modest-thompson-dg1dhc]

permissions:
  contents: read

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    env:
      PW_ENGINES: all
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chrome webkit firefox

      - name: Playwright, all three engines
        run: npm run e2e

      - name: Upload report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
